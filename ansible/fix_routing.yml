---
- name: Corregir routing SDN e ip_forward
  hosts: all
  tasks:

    - name: Activar ip_forward permanente
      sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        state: present
        sysctl_file: /etc/sysctl.d/99-proxmox-sdn.conf
        reload: yes

- name: Eliminar ruta conflictiva de vmbr1 en proxnode1
  hosts: proxnode1
  tasks:

    - name: Verificar si vmbr1 tiene IP conflictiva
      shell: ip addr show vmbr1 2>/dev/null | grep '172.24.4'
      register: vmbr1_conflict
      changed_when: false
      failed_when: false

    - name: Quitar IP conflictiva de vmbr1
      command: ip addr del 172.24.4.11/24 dev vmbr1
      when: vmbr1_conflict.rc == 0
      failed_when: false

    - name: Eliminar ruta de vmbr1 hacia red SDN
      shell: ip route del 172.24.4.0/24 dev vmbr1 2>/dev/null || true
      changed_when: false

    - name: Hacer la eliminación permanente via post-up en interfaces
      blockinfile:
        path: /etc/network/interfaces
        marker: "# {mark} FIX RUTA CONFLICTIVA vmbr1"
        block: |
          post-up ip route del 172.24.4.0/24 dev vmbr1 2>/dev/null || true
        insertafter: "iface vmbr1 inet static"
      failed_when: false

    - name: Verificar rutas finales
      shell: ip route show | grep 172.24.4
      register: routes_final
      changed_when: false
      failed_when: false

    - name: Mostrar rutas activas
      debug:
        var: routes_final.stdout_lines