# deploy_lab.yml
---
# ==========================================
# STAGE 1: CONFIGURACIÓN BASE Y LOCALES
# ==========================================
- name: Preparación Base de los Nodos Proxmox
  hosts: all
  vars:
    desired_locale: "en_US.UTF-8"
    domain: "midominio.org"
  tasks:
    - name: Configurar /etc/hosts con todos los nodos
      lineinfile:
        path: /etc/hosts
        line: "{{ hostvars[item]['ansible_host'] }} {{ item }}.{{ domain }} {{ item }}"
        state: present
      loop: "{{ groups['servers'] }}"
      when: item != inventory_hostname

    - name: Eliminar repositorios Enterprise (Evita el error 401)
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/pve-enterprise.list
        - /etc/apt/sources.list.d/ceph.list

    - name: Agregar repositorio PVE No-Subscription
      apt_repository:
        repo: "deb http://download.proxmox.com/debian/pve bookworm pve-no-subscription"
        state: present
        filename: pve-no-subscription

    - name: Instalar dependencias
      apt:
        name:
          - locales
          - python3-pexpect
          - sshpass
          - dnsmasq
        state: present
        update_cache: true

    - name: Deshabilitar dnsmasq global
      systemd:
        name: dnsmasq
        enabled: false
        state: stopped

    - name: Habilitar locale en /etc/locale.gen
      lineinfile:
        path: /etc/locale.gen
        regexp: "^#?{{ desired_locale }}"
        line: "{{ desired_locale }} UTF-8"
        state: present

    - name: Generar locales
      command: locale-gen

    - name: Establecer locale por defecto
      shell: "update-locale LANG={{ desired_locale }} LC_ALL={{ desired_locale }}"

# ==========================================
# STAGE 2: CREACIÓN Y UNIÓN DEL CLÚSTER
# ==========================================
- name: Configurar Clúster Proxmox VE
  hosts: proxnode1
  tasks:
    - name: Crear el clúster en el nodo maestro
      command: pvecm create proclus
      args:
        creates: /etc/pve/corosync.conf

- name: Unir Nodos Secundarios al Clúster
  hosts: proxnode2:proxnode3
  serial: 1                        # ← uno por uno para evitar race conditions
  tasks:
    - name: Unirse al clúster
      expect:
        command: pvecm add {{ hostvars['proxnode1']['ansible_host'] }}
        responses:
          "Are you sure you want to continue connecting": "yes"
          "(?i)password": "adminlogin"
        timeout: 60
      args:
        creates: /etc/pve/corosync.conf
      register: cluster_join
      failed_when:
        - cluster_join.failed
        - "'already a cluster member' not in (cluster_join.stdout | default('') + cluster_join.msg | default(''))"

    - name: Esperar a que pmxcfs sincronice en este nodo antes de continuar
      wait_for:
        path: /etc/pve/corosync.conf
        state: present
        timeout: 60

# ==========================================
# STAGE 3: INSTALACIÓN DE CEPH
# ==========================================
- name: Instalar Ceph en todos los nodos
  hosts: all
  tasks:
    - name: Instalar paquetes Ceph (Reef)
      shell: yes | pveceph install --repository no-subscription --version reef
      args:
        executable: /bin/bash

# ==========================================
# STAGE 4: INICIALIZAR CEPH EN EL MAESTRO
# ==========================================
- name: Inicializar Ceph en proxnode1
  hosts: proxnode1
  tasks:
    - name: Inicializar clúster Ceph
      command: pveceph init --network {{ ansible_host }}/24
      args:
        creates: /etc/pve/ceph.conf

    - name: Crear monitor principal
      command: pveceph createmon
      args:
        creates: /var/lib/ceph/mon/ceph-proxnode1

    - name: Pausa para que pmxcfs propague ceph.conf a los nodos secundarios
      pause:
        seconds: 30          # ← aumentado de 15 a 30

# ==========================================
# STAGE 5: MONITORES Y MANAGERS EN SECUNDARIOS
# ==========================================
- name: Monitores y Managers en todos los nodos
  hosts: all
  tasks:

    # LA CORRECCIÓN PRINCIPAL: esperar que /etc/pve/ceph.conf
    # exista en cada nodo antes de intentar createmon
    - name: Esperar propagación de ceph.conf via pmxcfs
      wait_for:
        path: /etc/pve/ceph.conf
        state: present
        timeout: 120
      when: inventory_hostname != 'proxnode1'

    - name: Crear Monitores Secundarios
      command: pveceph createmon --mon-address {{ ansible_host }}
      args:
        creates: /var/lib/ceph/mon/ceph-{{ inventory_hostname }}
      when: inventory_hostname != 'proxnode1'
      register: ceph_mon_res
      until: ceph_mon_res is succeeded
      retries: 6
      delay: 10

    - name: Crear Managers (MGR)
      command: pveceph createmgr
      args:
        creates: /var/lib/ceph/mgr/ceph-{{ inventory_hostname }}

    - name: Configurar /dev/vdb como OSD
      command: pveceph createosd /dev/vdb
      ignore_errors: true

# ==========================================
# STAGE 6: POOLS Y SDN
# ==========================================
- name: Pools de almacenamiento y SDN
  hosts: proxnode1
  vars:
    ceph_pool_name: "vmstore"
  tasks:
    - name: Verificar pools Ceph existentes
      command: ceph osd pool ls
      register: ceph_pools
      changed_when: false

    - name: Crear Pool Ceph
      command: pveceph pool create {{ ceph_pool_name }} --pg_autoscale_mode on --add_storages 1
      when: ceph_pool_name not in ceph_pools.stdout_lines

    - name: Crear zona SDN 'vmlocal'
      command: pvesh create /cluster/sdn/zones --zone vmlocal --type simple --dhcp dnsmasq --ipam pve
      register: sdn_zone_res
      failed_when:
        - sdn_zone_res.failed
        - "'already defined' not in sdn_zone_res.stderr"

    - name: Crear VNet 'sdnbr1'
      command: pvesh create /cluster/sdn/vnets --vnet sdnbr1 --zone vmlocal
      register: sdn_vnet_res
      failed_when:
        - sdn_vnet_res.failed
        - "'already exists' not in sdn_vnet_res.stderr and 'already defined' not in sdn_vnet_res.stderr"

    - name: Crear subred DHCP para sdnbr1
      command: >
        pvesh create /cluster/sdn/vnets/sdnbr1/subnets
        --subnet 172.24.4.0/24
        --type subnet
        --gateway 172.24.4.254
        --dhcp-range start-address=172.24.4.10,end-address=172.24.4.100
        --dhcp-dns-server 8.8.8.8
      register: sdn_subnet_res
      failed_when:
        - sdn_subnet_res.failed
        - "'already exists' not in sdn_subnet_res.stderr and 'already defined' not in sdn_subnet_res.stderr"

    - name: Aplicar configuración SDN
      command: pvesh set /cluster/sdn
      ignore_errors: true

# ==========================================
# STAGE 7: ACTIVAR SDN EN TODOS LOS NODOS
# ==========================================
- name: Activar interfaces SDN en todos los nodos
  hosts: all
  tasks:
    - name: Agregar directivas source para SDN en /etc/network/interfaces
      blockinfile:
        path: /etc/network/interfaces
        marker: "# {mark} PROXMOX SDN"
        block: |
          source /etc/network/interfaces.d/*
          source /etc/network/interfaces.d/sdn
        state: present

    - name: Recargar interfaces de red
      command: ifreload -a

# ==========================================
# STAGE 8: CORREGIR ROUTING SDN
# ==========================================
- name: Corregir ip_forward y rutas conflictivas
  hosts: all
  tasks:
    - name: Activar ip_forward permanente
      sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        state: present
        sysctl_file: /etc/sysctl.d/99-proxmox-sdn.conf
        reload: yes

- name: Eliminar ruta conflictiva vmbr1 en proxnode1
  hosts: proxnode1
  tasks:
    - name: Quitar ruta conflictiva de vmbr1 si existe
      shell: ip route del 172.24.4.0/24 dev vmbr1 2>/dev/null || true
      changed_when: false

    - name: Hacer permanente via post-up
      blockinfile:
        path: /etc/network/interfaces
        marker: "# {mark} FIX RUTA CONFLICTIVA vmbr1"
        block: |
          post-up ip route del 172.24.4.0/24 dev vmbr1 2>/dev/null || true
        insertafter: "iface vmbr1 inet static"
      failed_when: false

    - name: Configurar NAT para salida a internet desde VMs
      iptables:
        table: nat
        chain: POSTROUTING
        source: 172.24.4.0/24
        out_interface: vmbr0
        jump: MASQUERADE
        state: present

    - name: Hacer NAT permanente
      shell: iptables-save > /etc/iptables/rules.v4
      args:
        creates: /etc/iptables/rules.v4